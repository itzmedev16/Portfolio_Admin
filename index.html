<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Portfolio Manager</title>
    
    <!-- CSS Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        slate: {
                            950: '#020617'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Style Modules -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300 antialiased overflow-x-hidden min-h-screen flex items-center justify-center relative">

    <!-- Decorative Gradient Background Mesh -->
    <div class="mesh-bg">
        <div class="mesh-bg-circle-1"></div>
        <div class="mesh-bg-circle-2"></div>
    </div>

    <!-- Theme Toggle Floating Button -->
    <div class="absolute top-6 right-6 z-50">
        <button id="theme-toggle" class="p-2.5 rounded-xl bg-slate-200/50 hover:bg-slate-200 dark:bg-slate-800/50 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition duration-150 shadow-md">
            <i class="fas fa-adjust"></i>
        </button>
    </div>

    <!-- Login Container -->
    <main class="w-full max-w-md px-6 py-12 relative z-10 animate-fade-in-up">
        
        <!-- Brand/Header -->
        <div class="text-center mb-8">
            <div class="inline-flex w-12 h-12 rounded-2xl bg-blue-600 items-center justify-center text-white text-xl mb-4 shadow-lg shadow-blue-500/20">
                <i class="fas fa-user-shield"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white">Admin Authentication</h1>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-2">Access the hidden portfolio management dashboard</p>
        </div>

        <!-- Login Form Card -->
        <div class="glass-card p-8 rounded-3xl shadow-xl">
            <!-- Session Expired Alert Box -->
            <div id="session-alert" class="hidden mb-6 p-3 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-600 dark:text-amber-400 text-xs font-semibold flex items-center gap-2">
                <i class="fas fa-exclamation-triangle"></i>
                <span>Your session has expired. Please login again.</span>
            </div>

            <form id="login-form" class="space-y-6">
                <!-- Email Field -->
                <div>
                    <label for="login-email" class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Admin Email</label>
                    <div class="relative">
                        <span class="absolute left-4 top-3.5 text-slate-400"><i class="fas fa-envelope"></i></span>
                        <input type="email" id="login-email" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 dark:border-slate-800 bg-white/50 dark:bg-slate-900/50 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-white font-medium text-sm transition" placeholder="admin@example.com" required>
                    </div>
                </div>

                <!-- Password Field -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label for="login-password" class="block text-xs font-bold text-slate-400 uppercase tracking-wider">Password</label>
                    </div>
                    <div class="relative">
                        <span class="absolute left-4 top-3.5 text-slate-400"><i class="fas fa-lock"></i></span>
                        <input type="password" id="login-password" class="w-full pl-10 pr-12 py-3 rounded-xl border border-slate-200 dark:border-slate-800 bg-white/50 dark:bg-slate-900/50 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800 dark:text-white font-medium text-sm transition" placeholder="••••••••" required>
                        <button type="button" id="toggle-password-btn" class="absolute right-4 top-3.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition" aria-label="Toggle Password Visibility">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full py-3.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold transition shadow-lg shadow-blue-500/20 text-sm">
                    <i class="fas fa-sign-in-alt mr-2"></i> Log In
                </button>
            </form>
        </div>

        <!-- Footer link back to portfolio -->
        <div class="text-center mt-6">
            <a href="https://itzmedev16.github.io/Portfolio-public/" class="text-xs text-slate-500 hover:text-blue-600 dark:text-slate-400 dark:hover:text-sky-400 transition font-medium">
                <i class="fas fa-arrow-left mr-1"></i> Return to Homepage
            </a>
        </div>
    </main>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    
    <script>
        // Custom Login Controller
        document.addEventListener('DOMContentLoaded', () => {
            // Check if redirect query indicates expired session
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('session') === 'expired' || urlParams.get('redirect')) {
                document.getElementById('session-alert').classList.remove('hidden');
            }

            // Redirect if already logged in
            if (typeof AuthService !== 'undefined' && AuthService.isAuthenticated()) {
                redirectToDashboard();
            }

            // Password reveal toggle
            const pswInput = document.getElementById('login-password');
            const togglePswBtn = document.getElementById('toggle-password-btn');
            if (pswInput && togglePswBtn) {
                togglePswBtn.addEventListener('click', () => {
                    const icon = togglePswBtn.querySelector('i');
                    if (pswInput.type === 'password') {
                        pswInput.type = 'text';
                        icon.classList.replace('fa-eye', 'fa-eye-slash');
                    } else {
                        pswInput.type = 'password';
                        icon.classList.replace('fa-eye-slash', 'fa-eye');
                    }
                });
            }

            // Form Submit logic
            const loginForm = document.getElementById('login-form');
            if (loginForm) {
                loginForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const email = document.getElementById('login-email').value.trim();
                    const password = document.getElementById('login-password').value;
                    const submitBtn = loginForm.querySelector('button[type="submit"]');
                    const origText = submitBtn.innerHTML;

                    submitBtn.setAttribute('disabled', 'true');
                    submitBtn.innerHTML = `<i class="fas fa-spinner animate-spin mr-2"></i> Authenticating...`;

                    try {
                        await AuthService.login(email, password);
                        
                        Swal.fire({
                            icon: 'success',
                            title: 'Access Granted',
                            text: 'Login successful! Redirecting to dashboard...',
                            showConfirmButton: false,
                            timer: 1500,
                            timerProgressBar: true,
                            confirmButtonColor: '#3b82f6'
                        }).then(() => {
                            redirectToDashboard();
                        });
                    } catch (error) {
                        Swal.fire({
                            icon: 'error',
                            title: 'Access Denied',
                            text: error.message || 'Invalid email or password.',
                            confirmButtonColor: '#ef4444'
                        });
                    } finally {
                        submitBtn.removeAttribute('disabled');
                        submitBtn.innerHTML = origText;
                    }
                });
            }

            function redirectToDashboard() {
                const redirectPage = urlParams.get('redirect') || 'dashboard.html';
                window.location.href = redirectPage;
            }
        });
    </script>
</body>
</html>
